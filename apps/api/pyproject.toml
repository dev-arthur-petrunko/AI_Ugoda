[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# B008: FastAPI uses Depends()/Query() in argument defaults by design.
# F821: SQLAlchemy string forward references resolved at mapper config time.
ignore = ["B008", "F821"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
