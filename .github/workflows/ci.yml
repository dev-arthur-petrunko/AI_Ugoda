name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Web (tsc, lint, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aiugoda
          POSTGRES_PASSWORD: aiugoda
          POSTGRES_DB: aiugoda
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiugoda"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web deps
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/e2e/screenshots
          retention-days: 14

  api:
    name: API (ruff, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aiugoda
          POSTGRES_PASSWORD: aiugoda
          POSTGRES_DB: aiugoda
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiugoda"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://aiugoda:aiugoda@localhost:5432/aiugoda
      AUTH_DISABLED: "true"
      APP_ENV: development
      SECRET_KEY: ci-test-secret-key-not-for-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install API deps
        run: pip install -r requirements.txt

      - name: Ruff
        run: ruff check app

      - name: Migrations
        run: alembic upgrade head

      - name: Pytest
        working-directory: .
        run: python -m pytest -q
